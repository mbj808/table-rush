<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mad Facts Challenge</title>
  <meta name="description" content="Mad Facts Challenge (Table Rush). Practice multiplication, division, addition, subtraction, oceans, sports, Hawaiian islands, capitals, state maps, elements, flags, rhyming, and synonyms & antonyms; piano notes; instruments; vehicles; wonders of the world. No account needed." />
  <style>
    :root {
      --bg: #5ec4d6;
      --ink: #1b2430;
      --muted: #1f3a45;
      --paper: transparent;
      --line: rgba(255, 255, 255, 0.45);
      --sand: rgba(255, 255, 255, 0.22);
      --coral: #e15a3a;
      --forest: #1e7a4d;
      --forest-deep: #155c3a;
      --on-forest: #f4fff8;
      --forest-soft: rgba(255, 255, 255, 0.28);
      --primary: #1e7a4d;
      --primary-deep: #155c3a;
      --on-primary: #f4fff8;
      --aqua: rgba(212, 240, 245, 0.35);
      --aqua-soft: rgba(30, 122, 77, 0.42);
      --btn-face: rgba(255, 255, 255, 0.28);
      --btn-border: rgba(255, 255, 255, 0.55);
      --choice-on: #1e7a4d;
      --choice-on-ring: #0f3d28;
      --icon-bg: rgba(255, 255, 255, 0.28);
      --icon-border: rgba(255, 255, 255, 0.55);
      --wave-1: rgba(255, 255, 255, 0.55);
      --wave-2: rgba(120, 220, 235, 0.62);
      --wave-3: rgba(20, 110, 130, 0.45);
      --glass-blur: blur(8px);
      --btn-text: #f4fff8;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
      position: relative;
    }
    /* Pronounced wave layers — CSS/SVG, Chromebook-light */
    .wave-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #6ecfe0 0%, var(--bg) 38%, #2f96ab 100%);
    }
    .wave-bg svg {
      position: absolute;
      left: -28%;
      width: 156%;
      height: 52%;
      min-height: 14rem;
      will-change: transform;
    }
    .wave-bg .w1 {
      top: 2%;
      opacity: 1;
      animation: wave-drift 12s ease-in-out infinite;
    }
    .wave-bg .w2 {
      top: 28%;
      opacity: 0.95;
      animation: wave-drift 16s ease-in-out infinite reverse;
      animation-delay: -3s;
    }
    .wave-bg .w3 {
      top: 52%;
      height: 56%;
      opacity: 1;
      animation: wave-drift 18s ease-in-out infinite;
      animation-delay: -7s;
    }
    .wave-bg .w4 {
      bottom: -10%;
      top: auto;
      height: 44%;
      opacity: 0.9;
      animation: wave-drift 14s ease-in-out infinite reverse;
      animation-delay: -1.5s;
    }
    @keyframes wave-drift {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      25% { transform: translate3d(7%, -5.5%, 0) scaleY(1.08); }
      50% { transform: translate3d(-6%, 4%, 0) scaleY(0.94); }
      75% { transform: translate3d(5%, -3%, 0) scaleY(1.05); }
    }

    /* Unlock layers: Replay is the base aqua. Each earned beat adds one wave plus sparks. */
    .wave-bg .lv { display: none; }
    .wave-bg[data-level="1"] .lv-1 { display: block; }
    .wave-bg[data-level="2"] .lv-1,
    .wave-bg[data-level="2"] .lv-2 { display: block; }
    .wave-bg[data-level="3"] .lv-1,
    .wave-bg[data-level="3"] .lv-2,
    .wave-bg[data-level="3"] .lv-3 { display: block; }
    .wave-bg[data-level="4"] .lv-1,
    .wave-bg[data-level="4"] .lv-2,
    .wave-bg[data-level="4"] .lv-3,
    .wave-bg[data-level="4"] .lv-4 { display: block; }
    .wave-bg[data-level="5"] .lv-1,
    .wave-bg[data-level="5"] .lv-2,
    .wave-bg[data-level="5"] .lv-3,
    .wave-bg[data-level="5"] .lv-4 { display: block; }
    .wave-bg .w5 {
      top: 4%;
      height: 48%;
      opacity: 0.92;
      animation: wave-rise 11s ease-in-out infinite;
    }
    .wave-bg .w6 {
      top: 16%;
      height: 50%;
      opacity: 0.88;
      animation: wave-spark 9s ease-in-out infinite reverse;
      animation-delay: -2s;
    }
    .wave-bg .w7 {
      top: 34%;
      height: 52%;
      opacity: 0.8;
      animation: wave-square 13s ease-in-out infinite;
      animation-delay: -4s;
    }
    .wave-bg .w8 {
      top: auto;
      bottom: -6%;
      height: 46%;
      opacity: 0.85;
      animation: wave-bit 3.1s ease-in-out infinite reverse;
      animation-delay: -1s;
    }
    .wave-bg .w9 {
      top: 8%;
      height: 78%;
      opacity: 0.72;
      animation: wave-smile 1.7s ease-in-out infinite;
      animation-delay: -6s;
    }
    @keyframes wave-rise {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      50% { transform: translate3d(-8%, 5%, 0) scaleY(1.12); }
    }
    @keyframes wave-spark {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      30% { transform: translate3d(9%, -6%, 0) scaleY(1.18); }
      65% { transform: translate3d(-7%, 5%, 0) scaleY(0.9); }
    }
    @keyframes wave-square {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      25% { transform: translate3d(-6%, 4%, 0) scaleY(1.06); }
      50% { transform: translate3d(8%, -5%, 0) scaleY(1.14); }
      75% { transform: translate3d(-4%, -2%, 0) scaleY(0.92); }
    }
    @keyframes wave-bit {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      20% { transform: translate3d(12%, -8%, 0) scaleY(1.22); }
      40% { transform: translate3d(-14%, 9%, 0) scaleY(0.78); }
      60% { transform: translate3d(10%, 6%, 0) scaleY(1.28); }
      80% { transform: translate3d(-9%, -7%, 0) scaleY(0.84); }
    }
    @keyframes wave-smile {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1) scaleX(1); }
      25% { transform: translate3d(-16%, 10%, 0) scaleY(1.34) scaleX(1.08); }
      50% { transform: translate3d(14%, -12%, 0) scaleY(0.72) scaleX(0.92); }
      75% { transform: translate3d(-10%, -8%, 0) scaleY(1.26) scaleX(1.1); }
    }
    .spark-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff8dc;
      opacity: 0.85;
      animation: spark-drift 4.8s ease-in-out infinite;
    }
    .spark.hot {
      width: 2px;
      height: 2px;
      background: #f4ffff;
      box-shadow: 0 0 4px rgba(190, 255, 255, 0.9);
    }
    .spark.sq {
      width: 5px;
      height: 5px;
      border-radius: 1px;
      background: #efe7ff;
      animation-name: spark-drift-sq;
    }
    .spark.bit {
      width: 2px;
      height: 7px;
      border-radius: 1px;
      background: #b9fff2;
    }
    .spark.smile {
      width: 4px;
      height: 4px;
      background: #ffe3f1;
      box-shadow: 0 0 5px rgba(255, 214, 160, 0.85);
    }
    @keyframes spark-drift {
      0%, 100% { opacity: 0.28; transform: translate3d(0, 0, 0) scale(0.7); }
      45% { opacity: 1; transform: translate3d(var(--dx, 6px), var(--dy, -12px), 0) scale(1.25); }
      72% { opacity: 0.45; transform: translate3d(calc(var(--dx, 6px) * -0.45), calc(var(--dy, -12px) * 0.35), 0) scale(0.85); }
    }
    @keyframes spark-drift-sq {
      0%, 100% { opacity: 0.35; transform: translate3d(0, 0, 0) rotate(45deg) scale(0.75); }
      50% { opacity: 1; transform: translate3d(var(--dx, 8px), var(--dy, -10px), 0) rotate(45deg) scale(1.15); }
    }


    /* Bitwave (level 4) and Smile (level 5): psychedelic warp. Earlier levels unchanged. */
    .wave-bg[data-level="4"] {
      background: linear-gradient(180deg, #b9fbff 0%, #5ec8ea 28%, #7a3dff 100%);
    }
    .wave-bg[data-level="5"] {
      background: linear-gradient(180deg, #b9fbff 0%, #5ec8ea 28%, #7a3dff 100%);
    }
    .wave-bg[data-level="4"] .w1 { animation-duration: 6.2s; }
    .wave-bg[data-level="4"] .w2 { animation-duration: 7.4s; }
    .wave-bg[data-level="4"] .w3 { animation-duration: 8.2s; }
    .wave-bg[data-level="4"] .w4 { animation-duration: 6.6s; }
    .wave-bg[data-level="4"] .w5 { animation-duration: 5.2s; }
    .wave-bg[data-level="4"] .w6 { animation-duration: 4.4s; }
    .wave-bg[data-level="4"] .w7 { animation-duration: 5.8s; }
    .wave-bg[data-level="4"] .w8 { animation-duration: 3.1s; }
    .wave-bg[data-level="5"] .w1 { animation-duration: 6.2s; }
    .wave-bg[data-level="5"] .w2 { animation-duration: 7.4s; }
    .wave-bg[data-level="5"] .w3 { animation-duration: 8.2s; }
    .wave-bg[data-level="5"] .w4 { animation-duration: 6.6s; }
    .wave-bg[data-level="5"] .w5 { animation-duration: 5.2s; }
    .wave-bg[data-level="5"] .w6 { animation-duration: 4.4s; }
    .wave-bg[data-level="5"] .w7 { animation-duration: 5.8s; }
    .wave-bg[data-level="5"] .w8 { animation-duration: 3.1s; }
    .wave-bg[data-level="4"] .spark.bit,
    .wave-bg[data-level="5"] .spark.bit {
      width: 3px;
      height: 22px;
      background: #f4fffd;
      box-shadow: 0 0 8px #9dfff0, 0 0 16px rgba(255,255,255,0.85);
    }
    /* Thunder, Howl, and Cauldron are separate pictures. .night hides the wave art. */
    .wave-bg .jack,
    .wave-bg .moon,
    .wave-bg .howl-hill,
    .wave-bg .wolf,
    .wave-bg .cauldron-scene { display: none; }
    .wave-bg.night svg:not(.night-art),
    .wave-bg.night .spark,
    .wave-bg.night .warp { display: none !important; }
    .wave-bg.scene-thunder {
      background:
        radial-gradient(ellipse 55% 48% at 50% 58%, rgba(180, 20, 20, 0.35) 0%, rgba(180, 20, 20, 0) 70%),
        linear-gradient(180deg, #140818 0%, #2a1038 58%, #4a1420 100%);
    }
    .wave-bg.scene-howl {
      background: linear-gradient(180deg, #0c0618 0%, #1c1038 55%, #2a1848 100%);
    }
    .wave-bg.scene-cauldron {
      background:
        radial-gradient(ellipse 50% 40% at 50% 72%, rgba(80, 220, 70, 0.28) 0%, rgba(80, 220, 70, 0) 70%),
        linear-gradient(180deg, #100818 0%, #1a1030 60%, #241428 100%);
    }
    .wave-bg.scene-thunder .jack { display: block; }
    .wave-bg.scene-howl .moon,
    .wave-bg.scene-howl .howl-hill,
    .wave-bg.scene-howl .wolf { display: block; }
    .wave-bg.scene-cauldron .cauldron-scene { display: block; }
    .wave-bg.scene-bat {
      background: radial-gradient(ellipse 80% 70% at 50% 42%, #241848 0%, #100818 55%, #07040f 100%);
    }
    .wave-bg .bat-fly { display: none; }
    .wave-bg.scene-bat .bat-fly {
      display: block;
      position: absolute;
      left: 50%;
      top: 48%;
      width: min(110vw, 80rem);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      animation: bat-approach 4.6s linear infinite;
      pointer-events: none;
    }
    .wave-bg .bat-fly img {
      display: block;
      width: 100%;
      height: auto;
      filter: brightness(0);
      transform-origin: center center;
      animation: bat-flap 0.45s ease-in-out infinite;
    }
    @keyframes bat-approach {
      0% { transform: translate(-50%, -50%) scale(0.05); opacity: 0.95; }
      60% { opacity: 0.8; }
      82% { opacity: 0.38; }
      100% { transform: translate(-50%, -50%) scale(3.1); opacity: 0.14; }
    }
    @keyframes bat-flap {
      0%, 100% { transform: scaleX(1) scaleY(1); }
      50% { transform: scaleX(1.05) scaleY(0.74); }
    }
    /* Bats (level 10): the same fly-at-you loop as Haunt, in glowing crimson. */
    .wave-bg.scene-bats {
      background: radial-gradient(ellipse 80% 70% at 50% 42%, #241848 0%, #100818 55%, #07040f 100%);
    }
    .wave-bg .bats-fly { display: none; }
    .wave-bg.scene-bats .bats-fly {
      display: block;
      position: absolute;
      left: 50%;
      top: 48%;
      width: min(110vw, 80rem);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      animation: bat-approach 4.6s linear infinite;
      pointer-events: none;
    }
    .wave-bg .bats-shape {
      width: 100%;
      aspect-ratio: 280 / 95;
      background: #c1121f;
      -webkit-mask: url("assets/halloween/bat.svg") center / contain no-repeat;
      mask: url("assets/halloween/bat.svg") center / contain no-repeat;
      filter: drop-shadow(0 0 12px #ff3b3b) drop-shadow(0 0 28px rgba(193, 18, 31, 0.85));
      transform-origin: center center;
      animation: bat-flap 0.45s ease-in-out infinite;
    }

    /* Spooked (level 11): a public-domain witch spins in place, outlined with a pulsing glow. */
    .wave-bg.scene-spooked {
      background: radial-gradient(ellipse 80% 70% at 50% 42%, #241848 0%, #100818 55%, #07040f 100%);
    }
    .wave-bg .witch-spin { display: none; }
    .wave-bg.scene-spooked .witch-spin {
      display: block;
      position: absolute;
      left: 50%;
      top: 51.5%;
      width: min(108vmin, 48rem);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      animation: witch-spin 5s linear infinite;
      will-change: transform;
      pointer-events: none;
    }
    /* The glow filters are static, so each image is rasterized once and the spin and pulse
       run on the compositor (transform and opacity only). Animating the stacked
       drop-shadows on this huge image re-filtered it every frame and froze iPhone Safari. */
    .wave-bg .witch-art {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
      opacity: 0.72;
      filter: brightness(0)
        drop-shadow(0 0 4px #d8ffb0)
        drop-shadow(0 0 12px #3dff2e)
        drop-shadow(0 0 24px rgba(110, 40, 200, 0.55))
        drop-shadow(0 0 40px rgba(57, 255, 40, 0.28));
    }
    .wave-bg .witch-art.witch-glow {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      filter: brightness(0)
        drop-shadow(0 0 8px #f4ffe4)
        drop-shadow(0 0 20px #8dff62)
        drop-shadow(0 0 38px rgba(168, 90, 255, 0.9))
        drop-shadow(0 0 64px rgba(80, 255, 60, 0.7));
      animation: witch-glow-pulse 2.6s ease-in-out infinite;
      will-change: opacity;
    }
    @keyframes witch-spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes witch-glow-pulse {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.72; }
    }
    /* Belfry (level 12): a public-domain gothic tower under the moon, with bats pouring
       out of the left spire's belfry window. Bats are built by buildBelfryBats(). */
    .wave-bg.scene-belfry {
      background:
        radial-gradient(circle at 13% 17%, rgba(255, 238, 196, 0.22) 0, rgba(190, 170, 255, 0.08) 18%, transparent 38%),
        radial-gradient(ellipse 80% 70% at 50% 42%, #241848 0%, #100818 55%, #07040f 100%);
    }
    .wave-bg .belfry-moon,
    .wave-bg .belfry-scene { display: none; }
    .wave-bg.scene-belfry .belfry-moon {
      display: block;
      position: absolute;
      left: 13%;
      top: 17%;
      width: min(20vmin, 9rem);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 40% 38%, #fffbea 0%, #f7eecb 45%, #d9cc9e 100%);
      box-shadow: 0 0 22px rgba(255, 246, 214, 0.85), 0 0 70px rgba(214, 196, 255, 0.45);
      pointer-events: none;
    }
    .wave-bg.scene-belfry .belfry-scene {
      display: block;
      position: absolute;
      right: 3vw;
      bottom: 0;
      height: 94vh;
      aspect-ratio: 1070 / 1841;
      pointer-events: none;
    }
    .wave-bg .belfry-tower {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0.92;
      filter: brightness(0)
        drop-shadow(0 0 2px #dccdff)
        drop-shadow(0 0 10px rgba(160, 120, 255, 0.65))
        drop-shadow(0 0 24px rgba(130, 180, 255, 0.3));
    }
    /* Static brighter-glow copy whose opacity pulses (compositor-only). */
    .wave-bg .belfry-tower.belfry-glow {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      filter: brightness(0)
        drop-shadow(0 0 5px #f3edff)
        drop-shadow(0 0 16px rgba(190, 150, 255, 0.95))
        drop-shadow(0 0 40px rgba(150, 200, 255, 0.55));
      animation: belfry-glow-pulse 3.2s ease-in-out infinite;
      will-change: opacity;
    }
    @keyframes belfry-glow-pulse {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.92; }
    }
    /* Origin of the stream: the left spire's tall belfry window. */
    .wave-bg .belfry-bats {
      position: absolute;
      left: 25.5%;
      top: 35%;
      width: 0;
      height: 0;
      filter: drop-shadow(0 0 1.5px #f2ecff) drop-shadow(0 0 6px rgba(190, 150, 255, 0.9));
    }
    .wave-bg .belfry-bat {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--size, 2.4rem);
      aspect-ratio: 280 / 95;
      offset-rotate: 0deg;
      offset-anchor: center;
      opacity: 0;
      animation: belfry-stream var(--dur, 7s) linear infinite;
      animation-delay: var(--delay, 0s);
      will-change: offset-distance, transform, opacity;
    }
    .wave-bg .belfry-bat i {
      display: block;
      width: 100%;
      height: 100%;
      background: #120a1e;
      -webkit-mask: url("assets/halloween/bat.svg") center / contain no-repeat;
      mask: url("assets/halloween/bat.svg") center / contain no-repeat;
      animation: bat-flap var(--flap, 0.3s) ease-in-out infinite;
    }
    @keyframes belfry-stream {
      0% { offset-distance: 0%; transform: scale(0.5); opacity: 0; }
      3% { opacity: 1; }
      16% { offset-distance: 6%; }
      22% { transform: scale(0.85); }
      60% { transform: scale(1); opacity: 1; }
      92% { opacity: 0.85; }
      100% { offset-distance: 100%; transform: scale(1.15); opacity: 0; }
    }
    /* Moon Walk (level 13): a public-domain ghost walks across a cratered lunar surface
       in starry space, right to left, with low-gravity hops and dust puffs. */
    .wave-bg.scene-moonwalk {
      background-color: #02030a;
      background-image:
        radial-gradient(1.4px 1.4px at 22px 34px, #ffffff 50%, transparent 100%),
        radial-gradient(1px 1px at 118px 82px, #dfe8ff 50%, transparent 100%),
        radial-gradient(1.2px 1.2px at 64px 150px, #ffffff 50%, transparent 100%),
        radial-gradient(1px 1px at 172px 24px, #fff6d8 50%, transparent 100%),
        radial-gradient(1.6px 1.6px at 196px 128px, #ffffff 50%, transparent 100%),
        radial-gradient(1px 1px at 92px 196px, #cfdcff 50%, transparent 100%),
        radial-gradient(1.2px 1.2px at 36px 108px, #ffffff 50%, transparent 100%),
        radial-gradient(1px 1px at 150px 172px, #ffffff 50%, transparent 100%),
        radial-gradient(ellipse 70% 55% at 50% 40%, #0b1030 0%, #04050f 60%, #010106 100%);
      background-size:
        210px 210px, 210px 210px, 210px 210px, 210px 210px,
        170px 170px, 170px 170px, 250px 250px, 250px 250px,
        100% 100%;
    }
    .wave-bg .moonwalk-earth,
    .wave-bg .moonwalk-ground,
    .wave-bg .ghost-walk { display: none; }
    .wave-bg.scene-moonwalk .moonwalk-earth {
      display: block;
      position: absolute;
      right: 9vw;
      top: 13vh;
      width: min(12vmin, 5.5rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.55) 0, transparent 22%),
        radial-gradient(ellipse 30% 18% at 60% 46%, rgba(90, 170, 90, 0.95) 0, transparent 100%),
        radial-gradient(ellipse 22% 26% at 32% 62%, rgba(80, 160, 85, 0.9) 0, transparent 100%),
        radial-gradient(circle at 38% 34%, #6fb6ff 0%, #2a6fd6 52%, #0d2c6e 100%);
      box-shadow: 0 0 14px rgba(120, 180, 255, 0.75), 0 0 40px rgba(90, 150, 255, 0.35);
      pointer-events: none;
    }
    .wave-bg.scene-moonwalk .moonwalk-ground {
      display: block;
      position: absolute;
      left: -30vw;
      top: 76vh;
      width: 160vw;
      height: 70vh;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(ellipse 6% 9% at 30% 9%, rgba(60, 64, 78, 0.85) 0 55%, rgba(235, 238, 248, 0.55) 70%, transparent 76%),
        radial-gradient(ellipse 3.5% 5% at 41% 6%, rgba(60, 64, 78, 0.8) 0 55%, rgba(235, 238, 248, 0.5) 70%, transparent 76%),
        radial-gradient(ellipse 8% 10% at 58% 14%, rgba(66, 70, 86, 0.8) 0 55%, rgba(235, 238, 248, 0.5) 70%, transparent 76%),
        radial-gradient(ellipse 4% 5.5% at 70% 7%, rgba(60, 64, 78, 0.8) 0 55%, rgba(235, 238, 248, 0.5) 70%, transparent 76%),
        radial-gradient(ellipse 5% 7% at 79% 19%, rgba(60, 64, 78, 0.75) 0 55%, rgba(235, 238, 248, 0.45) 70%, transparent 76%),

    function shuffle(items) {

        copy[i] = copy[j];

        return {
          operation: opts.op,
          id: item.id,
          ask: opts.fallbackAsk(item),
          answer: answer,
          key: "clue:" + item.id + ":fallback",
          choices: opts.choicesFor(answer, pool)

      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      if (pick.build) return pick.build(pool, opts);

    function rhymeDistractors(promptWord, answer, familyId, poolFamilies) {
      const banned = new Set([promptWord, answer]);
      const sameFamily = (RHYME_BY_ID[familyId] && RHYME_BY_ID[familyId].words) || [];
      sameFamily.forEach(function (w) { banned.add(w); });

      const others = [];
      const seen = new Set();
      (poolFamilies || RHYME_FAMILIES).forEach(function (f) {
        if (f.id === familyId) return;
        f.words.forEach(function (w) {
          if (banned.has(w) || seen.has(w)) return;
          seen.add(w);
          others.push(w);
        });
      });
      ALL_RHYME_WORDS.forEach(function (entry) {
        if (entry.family === familyId || banned.has(entry.word) || seen.has(entry.word)) return;
        seen.add(entry.word);
        others.push(entry.word);
      });

      const start = firstLetter(promptWord);
      const sameStart = others.filter(function (w) { return firstLetter(w) === start; });
      const similarLen = others.filter(function (w) {
        return Math.abs(w.length - promptWord.length) <= 1 && firstLetter(w) !== start;
      });
      const rest = others.filter(function (w) {
        return firstLetter(w) !== start && Math.abs(w.length - promptWord.length) > 1;
      });

      const picked = [];
      const used = new Set();
      function takeFrom(list, n) {
        shuffle(list).forEach(function (w) {
          if (picked.length >= n || used.has(w)) return;
          used.add(w);
          picked.push(w);
        });
      }
      takeFrom(sameStart, 1);
      takeFrom(similarLen, 2);
      takeFrom(rest.concat(sameStart).concat(similarLen), 3);
      while (picked.length < 1) {
        const filler = "dog";
        const extras = ["dog", "cup", "pen", "box", "red", "yes", "no", "up", "in", "out"];
        for (let i = 0; i < extras.length && picked.length < 1; i++) {
          if (!banned.has(extras[i]) && !used.has(extras[i]) && extras[i] !== answer) {
            used.add(extras[i]);
            picked.push(extras[i]);
          }
        }
        break;
      }
      return shuffle([answer].concat(picked.slice(0, 1)));
    }

    function setOperation(op) {
      const wasMath = isMath();
      const willMath = op === "multiply" || op === "divide" || op === "add" || op === "subtract";
      const wasAddSub = state.operation === "add" || state.operation === "subtract";

      else if (!wasMath && !willMath && state.operation !== op) state.tables = defaultTablesFor(op);
      else if (wasMath && willMath && ((wasAddSub && !willAddSub) || (!wasAddSub && willAddSub))) state.tables = defaultTablesFor(op);
      else if (wasMath && willMath && state.operation !== op && willAddSub && wasAddSub) { /* keep range */ }

      if (op === "divide") {
        if (state.mode === "product" || state.mode === "factor") state.mode = state.mode === "factor" ? "divisor" : "quotient";
        else if (state.mode === "sum" || state.mode === "addend") state.mode = state.mode === "addend" ? "divisor" : "quotient";
        else if (state.mode === "difference" || state.mode === "missing") state.mode = state.mode === "missing" ? "divisor" : "quotient";
      } else if (op === "multiply") {

        else if (state.mode === "sum" || state.mode === "addend") state.mode = state.mode === "addend" ? "factor" : "product";
        else if (state.mode === "difference" || state.mode === "missing") state.mode = state.mode === "missing" ? "factor" : "product";
      } else if (op === "add") {

        else if (state.mode === "factor" || state.mode === "divisor" || state.mode === "addend") state.mode = "missing";

    function streakBanner() {

    function cycleItem(list, keyName) {

    function pairChoices(answer, names, salt) {
      const others = names.filter(function (n) { return n !== answer; });
      const wrong = others.length ? others[(salt || 0) % others.length] : names[0];
      return shuffle([answer, wrong]);
    }
    function buildOceanMapProblem() {
      const bodies = OCEAN_BODIES.slice();
      const picked = cycleItem(bodies, "oceanMapIndex");
      const body = picked.item;
      const wrongBody = bodies[(picked.idx + 1 + (picked.idx % 3)) % bodies.length];
      const wrong = wrongBody.id === body.id ? bodies[(picked.idx + 2) % bodies.length] : wrongBody;
      return {
        operation: "oceanmap", id: body.id, kind: body.kind,
        ask: body.kind === "sea" ? "Which sea is highlighted?" : "Which ocean is highlighted?",
        answer: body.name, key: "omap:" + body.id,
        choices: shuffle([body.name, wrong.name])

      return pool.length ? pool : FLAG_PICTURE_IDS.map(function (id) { return FLAG_BY_ID[id]; });

    function wonderChoices(body, pool) {

      const wrong = fallback[Math.floor(Math.random() * fallback.length)];

      return {

    function flagSvg(id) { return svgPicture("flag-svg", "A country flag", FLAG_ART[id] || FLAG_ART.usa, "0 0 320 200"); }
    function vehicleSvg(id) {
      const img = document.createElement("img");
      img.className = "vehicle-photo";
      img.src = "assets/vehicles/" + id + ".jpg";
      img.alt = "A vehicle";
      return img;
    }
    function wonderPhoto(id) {
      const img = document.createElement("img");
      img.className = "wonder-photo";
      img.src = "assets/wonders/" + id + ".jpg";
      img.alt = "A famous wonder of the world";
      img.decoding = "async";
      return img;
    }
    function pictureForProblem(problem) {
      const op = (problem && problem.operation) || state.operation;
      if (op === "oceanmap") return oceanWorldMap(problem.id);
      if (op === "flag") return flagSvg(problem.id);
      if (op === "piano") return pianoSvg(problem.id);
      if (op === "vehicle") return vehicleSvg(problem.id);
      if (op === "wonder") return wonderPhoto(problem.id);
      return null;
    }

    function renderPlay(app) {
      appendEarnedRewardLinks(app, true);
      if (state.playPage === "beats") {
        app.appendChild(musicCard(false));
        return;
      }
      const problem = state.problem;
      const hud = el("div", { class: "hud" });
      const score = el("span", { text: "Score " + state.score });
      if (state.gain) score.appendChild(el("span", { text: " +" + state.gain, style: "color:#1e7a4d" }));
      hud.appendChild(score);
      app.appendChild(hud);
      app.appendChild(streakBanner());
      if (state.beatJustUnlocked) app.appendChild(el("p", { class: "fact", text: "Beat " + beatLabel(state.beatJustUnlocked) + " unlocked" }));
      const eq = el("div", { class: "card eq" });
      if (isMultiples()) {
        eq.appendChild(el("p", { class: "label", text: "Multiples" }));
        eq.appendChild(el("p", { class: "prompt multiples-prompt", text: problem.ask }));
      } else if (isMakeTen()) {
        eq.appendChild(el("p", { class: "label", text: "Make Ten" }));
        const line = el("p", { class: "prompt" });
        line.appendChild(document.createTextNode(String(problem.a)));
        line.appendChild(el("span", { class: "times", text: "+" }));
        line.appendChild(el("span", { class: "times", text: "?" }));
        line.appendChild(document.createTextNode(" = 10"));
        eq.appendChild(line);
      } else if (isQuiz()) {
        eq.appendChild(el("p", { class: "label", text: quizPlayLabel() }));
        const pic = pictureForProblem(problem);
        if (pic) {
          eq.className = "card eq has-map";
          eq.appendChild(pic);
        } else if (problem.image) {
          eq.className = "card eq has-map";
          const img = el("img", {
            class: "state-map",
            src: problem.image,
            alt: "State outline with a star marking the capital",
            width: "176",
            height: "136",
            decoding: "async"
          });
          eq.appendChild(img);
        }
        if (problem.ask && !problem.pictureOnly) eq.appendChild(el("p", { class: "prompt quiz-prompt", text: problem.ask }));
      } else {
        let askLabel = "What is the product?";
        if (isDivide()) askLabel = state.mode === "quotient" ? "What is the quotient?" : "What number is missing?";
        else if (isAdd()) askLabel = state.mode === "sum" ? "What is the sum?" : "What number is missing?";
        else if (isSubtract()) askLabel = state.mode === "difference" ? "What is the difference?" : "What number is missing?";
        else if (state.mode === "factor") askLabel = "What number is missing?";
        eq.appendChild(el("p", { class: "label", text: askLabel }));
        const line = el("p", { class: "prompt" });
        if (isDivide()) {
          line.appendChild(document.createTextNode(String(problem.product)));
          line.appendChild(el("span", { class: "times", text: "÷" }));
          if (state.mode === "quotient") line.appendChild(document.createTextNode(String(problem.a)));
          else {
            line.appendChild(el("span", { class: "times", text: "?" }));
            line.appendChild(document.createTextNode(" = " + problem.b));
          }
        } else if (isAdd()) {
          line.appendChild(document.createTextNode(String(problem.a)));
          line.appendChild(el("span", { class: "times", text: "+" }));
          if (state.mode === "sum") line.appendChild(document.createTextNode(String(problem.b)));
          else {
            line.appendChild(el("span", { class: "times", text: "?" }));
            line.appendChild(document.createTextNode(" = " + problem.sum));
          }
        } else if (isSubtract()) {
          line.appendChild(document.createTextNode(String(problem.a)));
          line.appendChild(el("span", { class: "times", text: "−" }));
          if (state.mode === "difference") line.appendChild(document.createTextNode(String(problem.b)));
          else {
            line.appendChild(el("span", { class: "times", text: "?" }));
            line.appendChild(document.createTextNode(" = " + problem.difference));
          }
        } else {
          line.appendChild(document.createTextNode(String(problem.a)));
          line.appendChild(el("span", { class: "times", text: "×" }));
          if (state.mode === "product") line.appendChild(document.createTextNode(String(problem.b)));
          else {
            line.appendChild(el("span", { class: "times", text: "?" }));
            line.appendChild(document.createTextNode(" = " + problem.product));
          }
        }
        eq.appendChild(line);
      }
      const locked = performance.now() < state.lockUntil;
      if (locked && state.picked !== problem.answer) eq.appendChild(el("p", { class: "fact", text: factLabel(problem) }));
      app.appendChild(eq);
      const ink = isOceanMap() || isFlag() || isState() || isPiano() || isVehicle() || isWonder();
      const answers = el("div", { class: "answers" + (isMultiples() || isMakeTen() ? " multiples-answers" : ink ? " ink-answers" : isQuiz() ? " quiz-answers" : ""), role: "group", "aria-label": "Answers" });
      problem.choices.forEach(function (choice, index) {
        const right = locked && choice === problem.answer;
        const wrong = locked && state.picked === choice && choice !== problem.answer;
        const btn = el("button", { type: "button", class: right ? "right" : wrong ? "wrong" : "", onClick: function () { answer(choice); } });
        btn.appendChild(el("span", { text: String(choice) }));
        btn.appendChild(el("small", { text: "Key " + (index + 1) }));
        answers.appendChild(btn);
      });
      app.appendChild(answers);
    }

    function nextProblem(avoid) {
      state.problem = makeProblem(avoid);
      state.picked = null;
      state.gain = null;
      state.lockUntil = 0;
      render();
    }
    function start(pairs) {
      clearTimeout(feedback);
      if (isQuiz()) {
        /* quiz modes have no product/factor modes */
      } else if (isDivide()) {
        if (state.mode !== "quotient" && state.mode !== "divisor") state.mode = "quotient";
      } else if (isAdd()) {
        if (state.mode !== "sum" && state.mode !== "addend") state.mode = "sum";
      } else if (isSubtract()) {
        if (state.mode !== "difference" && state.mode !== "missing") state.mode = "difference";
      } else if (state.mode !== "product" && state.mode !== "factor") {
        state.mode = "product";
      }
      state.drill = pairs;
      state.score = 0;
      state.streak = 0;
      state.bestStreak = 0;
      state.correct = 0;
      state.total = 0;
      state.misses = [];
      state.newBest = false;
      state.beatJustUnlocked = "";
      state.multiplesIndex = 0;
      state.oceanMapIndex = 0;
      state.flagIndex = 0;
      state.pianoIndex = 0;
      state.pianoBag = null;
      state.pianoBagKey = "";
      state.makeTenBag = null;
      state.vehicleIndex = 0;
      state.wonderBag = null;
      state.wonderLast = "";
      state.playPage = "question";
      state.phase = "play";
      state.problem = makeProblem();
      state.picked = null;
      state.gain = null;
      state.lockUntil = 0;
      say("Started.");
      render();
    }
    function answer(choice) {
      if (state.phase !== "play" || performance.now() < state.lockUntil || !state.problem) return;
      const problem = state.problem;
      const ok = choice === problem.answer;
      const delay = ok ? CORRECT_FEEDBACK_MS : MISS_TEACH_MS;
      state.lockUntil = performance.now() + delay;
      state.picked = choice;
      state.total += 1;
      playTone(ok);
      if (ok) {
        state.streak += 1;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        state.gain = 10 + Math.min(state.streak, 8) * 2;
        state.score += state.gain;
        state.correct += 1;
        var unlockedId = maybeUnlockBeats();
        var justBeat = null;
        if (unlockedId) {
          for (var bi = 0; bi < PLAY_TRACKS.length; bi++) {
            if (PLAY_TRACKS[bi].id === unlockedId) justBeat = PLAY_TRACKS[bi];
          }
        }
        var justReward = justBeat && BEAT_REWARDS[justBeat.id];
        var mazeNote = justReward ? " Congratulations. " + justBeat.label + " is unlocked. " + justReward.speak : "";
        say("Correct. " + spokenFact(problem) + (justBeat ? " " + justBeat.label + " unlocked." : "") + mazeNote);
      } else {
        state.streak = 0;
        state.gain = null;
        if (isMultiples() || problem.operation === "multiples") {
          state.misses.push({ a: problem.a, b: problem.b, answer: problem.answer, operation: "multiples" });
        } else if (problem.operation === "maketen" || isMakeTen()) {
          state.misses.push({ operation: "maketen", a: problem.a, id: problem.a, answer: problem.answer, ask: problem.ask, key: problem.key });
        } else if (isQuiz() || (problem.operation && problem.operation !== "multiply" && problem.operation !== "divide" && problem.operation !== "add" && problem.operation !== "subtract")) {
          state.misses.push({
            id: problem.id, ask: problem.ask, answer: problem.answer,
            kind: problem.kind, key: problem.key, word: problem.word,
            operation: problem.operation || state.operation
          });
        } else if (problem.operation === "subtract" || (isSubtract() && problem.difference != null)) {
          // Rebuild uses addend-style pair: subtrahend + difference = minuend
          state.misses.push({
            a: problem.b, b: problem.difference,
            operation: "subtract"
          });
        } else {
          state.misses.push({ a: problem.a, b: problem.b, operation: problem.operation || state.operation });
        }
        say("Not quite. " + spokenFact(problem));
      }
      render();
      feedback = setTimeout(function () {
        if (state.phase !== "play") return;
        nextProblem(problem.key);
      }, delay);
    }
    document.getElementById("back").addEventListener("click", backToSetup);
    document.getElementById("page-bar").addEventListener("click", function () {
      if (state.phase !== "play") return;
      state.playPage = state.playPage === "beats" ? "question" : "beats";
      render();
    });
    document.getElementById("mute").addEventListener("click", function () {
      // A manual tap on the music button replaces any pending resume after a game.
      musicPausedForGame = null;
      const home = ensureHomeMusic();
      const play = ensurePlayMusic();
      if (state.muted) {
        // Unmute: this click is the user gesture that must start BGM (esp. iOS).
        state.muted = false;
        homeMusicAutoplayBlocked = false;
        writeSave();
        render();
        if (state.phase === "play") tryPlayPlayMusic();
        else tryPlayHomeMusic(false);
        updateMuteButton();
        return;
      }
      if (state.phase === "setup" && (home.paused || home.muted)) {
        // Not muted, but autoplay blocked — Music button is the clear unmute/start affordance.
        homeMusicAutoplayBlocked = false;
        home.muted = false;
        tryPlayHomeMusic(false);
        updateMuteButton();
        return;
      }
      if (state.phase === "play" && play && play.paused) {
        tryPlayPlayMusic();
        updateMuteButton();
        return;
      }
      state.muted = true;
      writeSave();
      render();
    });
    window.addEventListener("keydown", function (event) {
      if (state.phase !== "play" || !state.problem) return;
      const index = ["1", "2", "3", "4"].indexOf(event.key);
      if (index >= 0 && state.problem.choices[index] !== undefined) {
        event.preventDefault();
        answer(state.problem.choices[index]);
      }
    });
    loadSave();
    primeHomeMusicAutoplay();
    render();
  </script>
